[package]
name = "forecast-domain"
version = "0.1.0"
edition = "2021"
description = "Shared Forecast Network contracts: canonical JSON commitments and risk feed records, byte-identical to the Python reference."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
url = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Standalone: the Solana program workspace at the repo root keeps its own lockfile and toolchain.
[workspace]
