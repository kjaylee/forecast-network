[package]
name = "forecast-network-rs"
version = "0.1.0"
edition = "2021"
description = "Forecast Network edge Worker (workers-rs): native read paths, everything else strangled to the Python Worker."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
forecast-domain = { path = "../../packages/domain-rs" }
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
bs58 = "0.5"
curve25519-dalek = "4"
unicode-script = "0.5"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
futures-lite = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
