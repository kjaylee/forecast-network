name: Feed fallback

# The per-minute operator runs on the operator's own Mac, and nothing else drives
# the risk feed. A dead host therefore means a stale feed until a person notices,
# which is what happened for two days in September.
#
# This is a second trigger on infrastructure the operator does not own. It reads
# the public feed first and acts only once that feed is already stale, so on a
# healthy system it costs one GET and stops. It uses the scoped scheduler
# credential, which can start an operation tick and cannot administer anything.
#
# Alerting is the watchdog's job, not this one's. This only rescues.
on:
  schedule:
    - cron: '1-56/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger only if the feed has already gone stale
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: python3 scripts/feed_fallback.py
