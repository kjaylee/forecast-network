name: Application, domain and contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify domain, syntax and schema drift without installing dependencies
        env:
          TMPDIR: ${{ github.workspace }}/tmp
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/check.py

  full:
    # The domain job deliberately installs nothing, so the suites that verify
    # signature and key-handling vectors skip there. This job runs them, which is
    # the only place a regression in the canonical signing bytes would be caught.
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/tmp/pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the verification-only dependencies
        run: |
          mkdir -p "$TMPDIR"
          python -m pip install cryptography torf
      - name: Verify every suite, including the ones the bare job has to skip
        run: python scripts/check.py

  static:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/tmp/pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare existing static-analysis tools
        run: |
          mkdir -p "$TMPDIR"
          python -m pip install ruff==0.15.8 mypy==1.19.1
      - name: Verify lint and strict types
        run: |
          ruff check packages tests scripts apps/web/src
          mypy --strict packages/domain/src packages/application/src

  frontend:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser modules and regressions
        run: |
          mkdir -p "$TMPDIR"
          node --test apps/web/tests/*.mjs

  registry:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      CARGO_HOME: ${{ github.workspace }}/tmp/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/cargo-target
    steps:
      - uses: actions/checkout@v4
      - name: Verify registry guards with the locked dependencies
        run: |
          mkdir -p "$TMPDIR"
          cargo test --workspace --locked

  domain-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Verify the Rust domain crate reproduces the Python golden vectors
        working-directory: packages/domain-rs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --target wasm32-unknown-unknown

  edge:
    # This crate serves forecast.eastsea.xyz. It builds, lints and runs its own unit
    # tests here; its SQL is compared statement-by-statement against the Python Worker
    # by scripts/sql_parity.py, which the domain and full jobs run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Verify the Worker that serves production builds, lints and ties like Python
        working-directory: apps/web-rs
        # --locked, because the lockfile is committed and deploy_edge.py builds from it: a
        # resolver drift that passed here unlocked would fail at the deploy. Clippy runs on the
        # wasm target as well as the host, because the cfg(not(wasm32)) dev-dependency boundary
        # means a warning can exist on one and not the other, and the deploy lints on wasm.
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked
          cargo build --locked --release --target wasm32-unknown-unknown
